<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sport-Fabrik Inventory - Icon-Sprite (DESIGN.md §7)
  24px Raster, stroke 1.75, runde Kappen/Ecken, currentColor. Selbst gehostet,
  kein CDN, keine Icon-Schrift. Die meisten Symbole folgen den bekannten
  Feather/Lucide-Pfaden (ISC-Lizenz); "scan" und "chevrons-up-down" sind
  eigene, einfache Striche im selben Stil statt einer Kopie einer fremden
  Datei.
  Einbindung: <svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#icon-x"/></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
