<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>(function () { try { var t = localStorage.getItem('sportfabrikTheme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();</script>
  <title data-i18n="login.page_title">Anmelden · Sport-Fabrik</title>
  <link rel="stylesheet" href="/static/css/app.css?v=i18n-1">
</head>

<body>
  <header><a class="brand" href="/" data-i18n-aria-label="common.brand_name" aria-label="Sport-Fabrik Inventory"><img src="/static/img/sportfabrik-logo.png"
        alt="SPORT-FABRIK"><span>INVENTORY</span></a></header>
  <main style="max-width:460px">
    <h1 data-i18n="login.heading">Anmelden</h1>
    <section class="panel login-panel">
      <form id="login"><label data-i18n="login.kassennummer_label">Kassennummer<input id="kassennummer" name="kassennummer" inputmode="numeric"
            autocomplete="username" autofocus required></label><label id="passwordField" hidden data-i18n="login.password_label">Passwort<input
            id="password" name="password" type="password" autocomplete="current-password"></label><button
          id="submit" data-i18n="login.submit">Anmelden</button></form>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Sprache / Langue / Language">
        <button type="button" class="secondary lang-option" data-lang="de">DE</button>
        <button type="button" class="secondary lang-option" data-lang="fr">FR</button>
        <button type="button" class="secondary lang-option" data-lang="en">EN</button>
      </div>
    </section>
  </main>
  <footer data-i18n="common.footer">Sport-Fabrik Inventory</footer>
  <script src="/static/js/login-redirect.js"></script>
  <script src="/static/js/i18n.js?v=1"></script>
  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const next = safeLoginRedirect(params.get('next'), location.origin);
    let awaitingPassword = false;
    $('login').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true;
      $('status').className = '';
      $('status').textContent = window.SportfabrikI18n.t(awaitingPassword ? 'login.checking_password' : 'login.checking_kassennummer');
      try {
        const body = new URLSearchParams();
        body.set('kassennummer', $('kassennummer').value.trim());
        if (awaitingPassword) body.set('password', $('password').value);
        const response = await fetch('/login', { method: 'POST', body });
        const result = await response.json();
        if (!response.ok) {
          $('status').className = 'notice error';
          $('status').textContent = typeof result.detail === 'string' ? result.detail : window.SportfabrikI18n.t('login.failed');
          if (awaitingPassword) { $('password').value = ''; $('password').focus(); }
          return;
        }
        if (result.requires_password) {
          awaitingPassword = true;
          $('passwordField').hidden = false;
          $('password').focus();
          $('status').textContent = window.SportfabrikI18n.t('login.enter_password');
          return;
        }
        location.href = next;
      } catch (error) {
        $('status').className = 'notice error';
        $('status').textContent = window.SportfabrikI18n.t('login.connection_lost');
      } finally {
        $('submit').disabled = false;
      }
    });
    function highlightActiveLang() {
      document.querySelectorAll('#langSwitch .lang-option').forEach(function (button) {
        button.classList.toggle('active', button.dataset.lang === window.SportfabrikI18n.lang);
      });
    }
    document.querySelectorAll('#langSwitch .lang-option').forEach(function (button) {
      button.addEventListener('click', function () {
        window.SportfabrikI18n.setLanguage(button.dataset.lang).then(highlightActiveLang);
      });
    });
    document.addEventListener('sportfabrik:i18n-ready', highlightActiveLang);
    highlightActiveLang();
  </script>
  <script src="/static/js/theme.js?v=i18n-1"></script>
</body>

</html>
