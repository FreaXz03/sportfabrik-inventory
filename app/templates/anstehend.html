<!doctype html>
<html lang="de">

<head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width,initial-scale=1">
     <script src="/static/js/theme-init.js?v=2"></script>
     <script src="/static/js/i18n.js?v=1"></script>
     <title data-i18n="anstehend.page_title">Anstehend · Sport-Fabrik</title>
     <link rel="stylesheet" href="/static/css/app.css?v=stufe-1">
</head>

<body>
     <header><a class="brand" href="/" data-i18n-aria-label="anstehend.brand_aria" aria-label="Sport-Fabrik Inventory – Anstehend"><img
                    src="/static/img/sportfabrik-logo.png" alt="SPORT-FABRIK"><span>INVENTORY</span></a>
          <nav data-i18n-aria-label="nav.main_aria" aria-label="Hauptnavigation"></nav>
     </header>
     <main>
          <h1 data-i18n="nav.anstehend">Anstehend</h1>
          <p id="heuteText" class="muted"></p>
          <p id="status" role="status" aria-live="polite" data-i18n="dashboard.loading">Übersicht wird geladen …</p><button id="retry"
               class="secondary" hidden data-i18n="common.retry">Erneut versuchen</button>
          <p id="ohneFiliale" class="muted" hidden data-i18n="dashboard.no_lagerort">Für Bestand, Verkäufe und Anstehendes unter Einstellungen eine Filiale wählen.</p>
          <div class="dashboard-grid">
               <section class="panel" id="anstehendPanel" hidden>
                    <h2 data-i18n="dashboard.todo_heading">Anstehend</h2>
                    <ul id="anstehend" class="todo-list"></ul>
                    <p id="nichtsAnstehend" class="muted" hidden data-i18n="dashboard.todo_empty">Nichts Dringendes – alles erledigt.</p>
               </section>
               <section class="panel">
                    <h2 data-i18n="dashboard.news_heading">Aktuelles</h2>
                    <ul id="aktuelles" class="news-list"></ul>
                    <p id="nichtsNeues" class="muted" hidden data-i18n="dashboard.news_empty">Noch keine Buchungen.</p>
               </section>
          </div>
     </main>
     <script src="/static/js/anstehend-liste.js?v=4"></script>
     <script src="/static/js/anstehend.js?v=3"></script>
     <script src="/static/js/nav.js?v=14"></script>
     <script src="/static/js/session.js?v=settings-2"></script>
     <script src="/static/js/meldung.js?v=2"></script>
     <script src="/static/js/theme.js?v=design-1"></script>
</body>

</html>
