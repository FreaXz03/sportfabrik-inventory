<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rechnungen & Historie · Sport-Fabrik</title><link rel="stylesheet" href="/static/app.css?v=sportfabrik-1"></head><body><header><a class="brand" href="/" aria-label="Sport-Fabrik Inventory – Übersicht"><img src="/static/sportfabrik-logo.png" alt="SPORT-FABRIK"><span>INVENTORY</span></a><nav aria-label="Hauptnavigation"><a href="/">Übersicht</a><a href="/articles">Artikel</a><a href="/invoices">Rechnungen</a><a href="/preview">Rechnung hochladen</a></nav></header><main><h1 id="title">Rechnungen</h1><p id="intro">Alle importierten Rechnungen mit ihren ursprünglichen Positionen.</p><section class="panel"><form id="search"><label>Rechnungsnummer<input name="q" maxlength="200" placeholder="Rechnung suchen"></label><button>Suchen</button><button type="button" class="secondary" id="reset">Alle anzeigen</button></form><p id="status" role="status" aria-live="polite"></p><button id="retry" class="secondary" hidden>Erneut versuchen</button><div class="tablewrap" id="table" hidden><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="paging"><button id="prev" class="secondary" disabled>← Zurück</button><span id="page"></span><button id="next" class="secondary" disabled>Weiter →</button></div></section></main><script>
const $=id=>document.getElementById(id);const path=location.pathname;const list=path==='/invoices';const article=path.startsWith('/articles/');const endpoint=list?'/api/invoices':'/api'+path;let page=1,q='',controller=null;const pageSize=25;
function el(tag,text){const n=document.createElement(tag);n.textContent=text??'—';return n;}function date(s){return s?s.slice(0,10).split('-').reverse().join('.'):'—';}function link(text,url){const n=el('a',text);n.href=url;return n;}function add(row,value){const td=document.createElement('td');td.append(value instanceof Node?value:document.createTextNode(value??'—'));row.append(td);}
if(!list){$('search').hidden=true;$('title').textContent=article?'Artikelhistorie':'Rechnungsdetails';$('intro').textContent='Jede Lieferung bleibt einzeln sichtbar, auch bei wiederholten Artikeln innerhalb derselben Rechnung.';}
async function load(){if(controller)controller.abort();const current=new AbortController();controller=current;$('retry').hidden=true;$('table').hidden=true;$('prev').disabled=true;$('next').disabled=true;$('status').textContent='Daten werden geladen …';const params=new URLSearchParams({page,page_size:pageSize});if(list)params.set('q',q);try{const response=await fetch(endpoint+'?'+params,{signal:current.signal});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Daten konnten nicht geladen werden.');if(controller!==current)return;if(data.invoice){$('title').textContent='Rechnung '+data.invoice.invoice_number;$('intro').textContent=`${data.invoice.supplier??''} · Rechnungsdatum ${date(data.invoice.invoice_date)} · Belegdatum ${date(data.invoice.document_date)} · Datei: ${data.invoice.filename??'—'}`;}if(data.product){$('title').textContent=`${data.product.brand??''} ${data.product.description??'Artikelhistorie'}`;$('intro').textContent=`EAN ${data.product.ean??'—'} · Alle Lieferpositionen, neueste Rechnung zuerst.`;}const headers=list?['Rechnung','Datum','Lieferant','Positionen','Dateiname','Importiert']:['Position / PDF-Seite','Rechnung / Datum','Artikel','EAN','Art. Nr. / Lief. Art. Nr.','Farbe / Grösse','Menge','Einheit','UVP','Originaltext'];const hr=document.createElement('tr');headers.forEach(h=>hr.append(el('th',h)));$('head').replaceChildren(hr);const fragment=document.createDocumentFragment();for(const item of data.items){const row=document.createElement('tr');if(list){add(row,link(item.invoice_number,'/invoices/'+item.id));for(const value of [date(item.invoice_date),item.supplier,String(item.item_count),item.filename,date(item.uploaded_at)])add(row,value);}else{add(row,`${item.row_number??'—'} / ${item.page??'—'}`);const invoice=document.createElement('div');invoice.append(link(item.invoice_number,'/invoices/'+item.invoice_id),el('p',date(item.invoice_date)));add(row,invoice);add(row,link(`${item.brand??''} ${item.description??''}`,'/articles/'+item.product_id+'/history'));add(row,item.ean);add(row,`${item.article_no??'—'} / ${item.supplier_article_no??'—'}`);add(row,`${item.color??'—'} / ${item.size??'—'}`);add(row,item.quantity);add(row,item.unit);add(row,item.uvp===null?'—':item.uvp+' CHF');if(item.source_available){const details=document.createElement('details');details.append(el('summary','Ansehen'),el('pre',item.raw_lines.join('\n')));add(row,details);}else add(row,'Kein Originaltext gespeichert; Artikeldaten aus dem Stamm.');}fragment.append(row);}$('rows').replaceChildren(fragment);$('table').hidden=!data.items.length;$('status').textContent=data.total?`${data.total} ${list?'Rechnungen':'Positionen'} · ${Math.min((page-1)*pageSize+1,data.total)}–${Math.min(page*pageSize,data.total)} angezeigt`:list?'Keine Rechnungen gefunden.':'Keine Lieferpositionen vorhanden.';$('page').textContent=`Seite ${page} von ${Math.max(1,Math.ceil(data.total/pageSize))}`;$('prev').disabled=page<=1;$('next').disabled=page*pageSize>=data.total;}catch(error){if(error.name==='AbortError')return;$('status').textContent=error.message==='Failed to fetch'?'Verbindung zur App unterbrochen.':error.message;$('page').textContent='';$('retry').hidden=false;}}
$('search').addEventListener('submit',e=>{e.preventDefault();q=new FormData(e.target).get('q').trim();page=1;load();});$('reset').addEventListener('click',()=>{$('search').reset();q='';page=1;load();});$('prev').addEventListener('click',()=>{page--;load();});$('next').addEventListener('click',()=>{page++;load();});$('retry').addEventListener('click',load);load();
</script><footer>Sport-Fabrik Inventory · Gelieferte Mengen sind kein aktueller Lagerbestand.</footer><script src="/static/navigation.js"></script></body></html>
