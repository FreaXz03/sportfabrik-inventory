<!doctype html>
<html lang="de">

<head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
     <meta name="theme-color" content="#F5F4F2" media="(prefers-color-scheme: light)">
     <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-title" content="SF Inventory">
     <link rel="manifest" href="/static/manifest.webmanifest">
     <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
     <script src="/static/js/theme-init.js?v=1"></script>
     <script src="/static/js/i18n.js?v=1"></script>
     <title data-i18n="reduktion.page_title">Runterschreiben · Sport-Fabrik</title>
     <link rel="stylesheet" href="/static/css/app.css?v=design-2">
     <link rel="stylesheet" href="/static/css/handy.css?v=3">
</head>

<body class="phone">
     <header><a class="brand" href="/m" data-i18n-aria-label="phone.home_aria" aria-label="Startseite"><img
                    src="/static/img/sportfabrik-logo.png" alt="SPORT-FABRIK"></a></header>
     <main>
          <a class="m-back" href="/m" id="back"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#icon-arrow-left"></use></svg><span data-i18n="phone.back">Zurück</span></a>
          <h1 data-i18n="reduktion.heading">Runterschreiben</h1>

          <label for="lagerort" data-i18n="reduktion.filter_lagerort">Filiale</label>
          <select id="lagerort"></select>

          <p id="status" role="status" aria-live="polite" class="muted"></p>
          <div id="gruppen"></div>

          <h2 data-i18n="reduktion_wahl.pick_heading">Artikel von Hand reduzieren</h2>
          <p class="muted" data-i18n="reduktion_wahl.pick_hint">EAN scannen oder Namen eingeben – ohne Eingabe zeigt die Liste den ganzen Bestand dieser Filiale.</p>

          <section id="pickView">
               <div id="picker"></div>
          </section>

          <section id="itemView" hidden>
               <div class="m-article-card">
                    <p class="m-eyebrow" id="itemBrand"></p>
                    <strong id="itemTitle"></strong>
                    <span id="itemVariant"></span>
               </div>
               <p id="itemHint" class="m-hint"></p>
               <div id="itemButtons"></div>
               <p id="itemStatus" role="status" aria-live="polite" class="m-current"></p>
               <button type="button" class="secondary large m-wide" id="other" data-i18n="phone.pick_other">Anderen Artikel wählen</button>
          </section>

          <h3 data-i18n="reduktion_wahl.manual_heading">Von Hand gewählt</h3>
          <p id="manuellLeer" class="muted" data-i18n="reduktion_wahl.manual_empty">In dieser Filiale ist nichts von Hand reduziert.</p>
          <ul id="manuellListe" class="m-positions" hidden></ul>
     </main>
     <script src="/static/js/handy-core.js?v=1"></script>
     <script src="/static/js/handy-scan.js?v=1"></script>
     <script src="/static/js/handy-pick.js?v=1"></script>
     <script src="/static/js/reduktion-wahl.js?v=2"></script>
     <script src="/static/js/handy-runterschreiben.js?v=2"></script>
     <script src="/static/js/session.js?v=header-2"></script>
     <script src="/static/js/theme.js?v=design-1"></script>
</body>

</html>
