<!doctype html>
<html lang="de">

<head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width,initial-scale=1">
     <script>(function () { try { var t = localStorage.getItem('sportfabrikTheme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();</script>
     <script src="/static/js/i18n.js?v=1"></script>
     <title data-i18n="konten.page_title">Kontoverwaltung · Sport-Fabrik</title>
     <link rel="stylesheet" href="/static/css/app.css?v=bedienung-14">
</head>

<body>
     <header><a class="brand" href="/" data-i18n-aria-label="konten.brand_aria" aria-label="Sport-Fabrik Inventory – Kontoverwaltung"><img
                    src="/static/img/sportfabrik-logo.png" alt="SPORT-FABRIK"><span>INVENTORY</span></a>
          <nav data-i18n-aria-label="nav.main_aria" aria-label="Hauptnavigation"></nav>
     </header>
     <main>
          <h1 data-i18n="konten.heading">Kontoverwaltung</h1>
          <p data-i18n="konten.intro">Mitarbeiter- und Filialleiter-Konten anlegen und löschen.</p>
          <p id="status" role="status" aria-live="polite" data-i18n="konten.loading">Konten werden geladen …</p>
          <button id="retry" class="secondary" hidden data-i18n="common.retry">Erneut versuchen</button>

          <section class="panel">
               <h2 data-i18n="konten.new_heading">Neues Konto</h2>
               <form id="neuForm" class="filters" novalidate>
                    <label><span data-i18n="konten.field_kassennummer">Kassennummer</span><input id="neuKassennummer" required autocomplete="off"></label>
                    <label><span data-i18n="konten.field_name">Name</span><input id="neuName" required autocomplete="off"></label>
                    <label><span data-i18n="konten.field_role">Rolle</span>
                         <select id="neuRole">
                              <option value="mitarbeiter" data-i18n="role.mitarbeiter">Mitarbeiter</option>
                              <option value="chef" data-i18n="role.chef">Filialleiter</option>
                              <option value="admin" data-i18n="role.admin">Zentrale</option>
                         </select>
                    </label>
                    <label id="neuPasswortFeld"><span data-i18n="konten.field_password">Passwort</span><input id="neuPasswort" type="password" autocomplete="new-password"></label>
               </form>
               <fieldset id="neuFilialen" class="filters">
                    <legend data-i18n="konten.field_lagerorte">Filialen</legend>
               </fieldset>
               <button id="anlegen" type="button" data-i18n="konten.submit">Konto anlegen</button>
               <p id="neuStatus" role="status" aria-live="polite"></p>
          </section>

          <section class="panel">
               <h2 data-i18n="konten.list_heading">Bestehende Konten</h2>
               <div class="tablewrap">
                    <table>
                         <thead>
                              <tr>
                                   <th data-i18n="konten.field_kassennummer">Kassennummer</th>
                                   <th data-i18n="konten.field_name">Name</th>
                                   <th data-i18n="konten.field_role">Rolle</th>
                                   <th data-i18n="konten.field_lagerorte">Filialen</th>
                                   <th data-i18n="konten.table_actions">Aktion</th>
                              </tr>
                         </thead>
                         <tbody id="rows"></tbody>
                    </table>
               </div>
          </section>
     </main>
     <footer data-i18n="common.footer">Sport-Fabrik Inventory</footer>
     <script src="/static/js/konten.js?v=1"></script>
     <script src="/static/js/nav.js?v=3"></script>
     <script src="/static/js/session.js?v=header-2"></script>
     <script src="/static/js/theme.js?v=i18n-1"></script>
</body>

</html>
