<!doctype html>
<html lang="de">

<head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width,initial-scale=1">
     <script>(function () { try { var t = localStorage.getItem('sportfabrikTheme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();</script>
     <script src="/static/js/i18n.js?v=1"></script>
     <title data-i18n="bestand.page_title">Bestand · Sport-Fabrik</title>
     <link rel="stylesheet" href="/static/css/app.css?v=bedienung-11">
</head>

<body>
     <header><a class="brand" href="/" data-i18n-aria-label="bestand.brand_aria" aria-label="Sport-Fabrik Inventory – Bestand"><img
                    src="/static/img/sportfabrik-logo.png" alt="SPORT-FABRIK"><span>INVENTORY</span></a>
          <nav data-i18n-aria-label="nav.main_aria" aria-label="Hauptnavigation"></nav>
     </header>
     <main>
          <h1><span data-i18n="bestand.heading">Bestand</span> <span id="titelFiliale" class="title-branch"></span></h1>
          <p data-i18n="bestand.intro">Aktueller Bestand je Filiale. Ware an einem externen Standort hat noch kein
               Eingangsdatum — die Lagerdauer beginnt erst in einer Filiale.</p>
          <form id="filters" class="filters" onsubmit="return false;"><label data-i18n="bestand.filter_lagerort">Filiale<select id="lagerort">
                         <option value="alle" data-i18n="bestand.filter_all">Alle Filialen und Standorte</option>
                    </select></label><label data-i18n="bestand.filter_search">Suche<input id="suche" type="search" maxlength="200"
                         data-i18n-placeholder="bestand.filter_search_placeholder" placeholder="Marke, Bezeichnung, Artikelnr., EAN …"></label>
          </form>
          <p id="vorgabe" class="notice filter-hint" hidden><span id="vorgabeText"></span> <button type="button"
                    class="secondary" id="vorgabeWeg" data-i18n="filter_active.show_all">Alle zeigen</button></p>
          <p id="status" role="status" aria-live="polite" data-i18n="bestand.loading">Bestand wird geladen …</p><button id="retry"
               class="secondary" hidden data-i18n="common.retry">Erneut versuchen</button>
          <p id="empty" class="muted" hidden data-i18n="bestand.empty">Für diese Auswahl ist kein Bestand erfasst.</p>
          <div id="tabelle"></div>
          <button id="mehr" class="secondary" hidden data-i18n="bestand.more">Weitere Zeilen laden</button>
     </main>
     <footer data-i18n="common.footer">Sport-Fabrik Inventory</footer>
     <script src="/static/js/bestand.js?v=7"></script>
     <script src="/static/js/nav.js?v=2"></script>
     <script src="/static/js/session.js?v=header-2"></script>
     <script src="/static/js/theme.js?v=i18n-1"></script>
</body>

</html>
